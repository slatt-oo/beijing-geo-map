name: beijing-geo-map

x-backend-build: &backend-build
  context: ./backend
  args:
    GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}

x-database-url: &database-url "postgres://${POSTGRES_USER:-geo}:${POSTGRES_PASSWORD:-geo}@db:5432/${POSTGRES_DB:-geo}?sslmode=disable"

services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geo}
      POSTGRES_DB: ${POSTGRES_DB:-geo}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 必须走 TCP：初始化阶段的临时实例只监听 unix socket，这样可以避免初始化尚未完成就被判定为健康。
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  seed:
    build: *backend-build
    command: ["importer"]
    environment:
      DATABASE_URL: *database-url
      DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./data/raw:/data:ro
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: *backend-build
    environment:
      DATABASE_URL: *database-url
      HTTP_ADDR: ":8000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/v1/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        VITE_TILE_URL: ${VITE_TILE_URL:-}
        VITE_TILE_CRS: ${VITE_TILE_CRS:-gcj02}
        VITE_TILE_ATTRIBUTION: ${VITE_TILE_ATTRIBUTION:-}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
